<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet"/>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Student Records Management</h1>

      <div class="card p-4">
        <div class="mb-3">
          <label class="form-label">Student ID</label> 
          <input type="text"id="studentId"class="form-control"placeholder="Enter Student ID"/>
        </div>

        <div class="mb-3">
          <label class="form-label">Student Name</label>
          <input type="text"id="studentName"class="form-control"placeholder="Enter Student Name"/>
        </div>

        <div class="mb-3">
          <label class="form-label">Course</label>
          <input type="text"id="studentCourse"class="form-control"placeholder="Enter Course"/>
        </div>

        <button onclick="addBtn()" class="btn btn-success">Add Student</button>
      </div>

      <div class="mt-5">
        <h3>Student Records</h3>


        <table class="table">
          <thead class="table-dark">
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Course</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="studentTable">

          </tbody>
        </table>
      </div>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
